<section id="contact" class="section contact">
  <div class="container">
    <div class="section-header">
      <span class="section-subtitle">Get In Touch</span>
      <h2 class="section-title">Contact Me</h2>
    </div>

    <div class="contact-content">
      <div class="contact-info">
        <h3>Let's connect</h3>
        <p>I'm always interested in hearing about new opportunities, collaborations, or just having a chat about technology.</p><br><br>
        
        <div class="contact-details">
          
          <div class="contact-item">
            <span class="icon">📍</span>
            <span>Chennai,Tamil Nadu,India</span>
          </div>
        </div>
      </div>

      <div class="contact-form">
        <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
          <div class="form-group">
            <input 
              type="text" 
              name="name" 
              [(ngModel)]="formData.name"
              placeholder="Your Name"
              required
              #name="ngModel">
            <div class="error" *ngIf="name.invalid && name.touched">
              Name is required
            </div>
          </div>

          <div class="form-group">
            <input 
              type="email" 
              name="email" 
              [(ngModel)]="formData.email"
              placeholder="Your Email"
              required
              email
              #email="ngModel">
            <div class="error" *ngIf="email.invalid && email.touched">
              <span *ngIf="email.errors?.['required']">Email is required</span>
              <span *ngIf="email.errors?.['email']">Please enter a valid email</span>
            </div>
          </div>

          <div class="form-group">
            <textarea 
              name="message" 
              [(ngModel)]="formData.message"
              placeholder="Your Message"
              rows="5"
              required
              #message="ngModel"></textarea>
            <div class="error" *ngIf="message.invalid && message.touched">
              Message is required
            </div>
          </div>

          <button type="submit" [disabled]="contactForm.invalid">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</section>
