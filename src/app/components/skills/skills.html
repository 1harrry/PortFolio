<section id="skills" class="section skills">
  <div class="container">
    <div class="section-header">
      <span class="section-subtitle">My Technical Expertise</span>
      <h2 class="section-title">Skills & Technologies</h2>
    </div>

    <div class="skills-categories">
      <div class="skill-category" *ngFor="let category of skills">
        <h3>{{category.name}}</h3>
        <div class="skills-grid">
          <div class="skill-card" *ngFor="let skill of category.items">
            <div class="skill-icon">{{skill.icon}}</div>
            <h4>{{skill.name}}</h4>
            <div class="skill-level">
              <div class="level-bar" [style.width.%]="skill.level"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
